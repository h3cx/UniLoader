[package]
name = "uniloader"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
chrono = "0.4.44"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.0.6"
zip = "8.2.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
